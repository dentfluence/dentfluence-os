<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dentfluence Experience Center</title>
<style>
:root{
  --primary:#702070; --primary-dark:#4a1548; --primary-light:#f4e8f4;
  --gold:#b8862f; --indigo:#2d2a55; --titanium:#8a8a94; --cyan:#8fd8e0; --graphite:#3a3740;
  --ink:#14121a; --paper:#ffffff; --muted:#6b6470; --line:#e8e3e8; --panel:#faf7fa;
  --font: -apple-system,"SF Pro Display","Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1); --dur: 900ms; --dur-s: 600ms; --dur-l: 1200ms;
}
html[data-theme="dark"]{ --ink:#f3eef3; --paper:#0b0a0d; --muted:#a89fa8; --line:#242028; --panel:#141116; --primary-light:#26182a; }
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{ font-family:var(--font); background:var(--paper); color:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; transition:background 1.1s var(--ease),color 1.1s var(--ease); }
.glow{ position:fixed; border-radius:50%; filter:blur(110px); pointer-events:none; z-index:0; }
.glow1{ width:52vw; height:52vw; background:radial-gradient(circle,var(--primary) 0%,transparent 70%); top:-18%; right:-14%; opacity:.14; animation:driftA 34s ease-in-out infinite; }
.glow2{ width:40vw; height:40vw; background:radial-gradient(circle,var(--gold) 0%,transparent 70%); bottom:-16%; left:-10%; opacity:.08; animation:driftB 40s ease-in-out infinite; }
@keyframes driftA{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(-3%,4%);} }
@keyframes driftB{ 0%,100%{ transform:translate(0,0);} 50%{ transform:translate(4%,-3%);} }
.deck{ position:relative; width:100vw; height:100vh; overflow:hidden; z-index:1; }
.slide{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:5.5vh 7vw; opacity:0; transform:translateY(26px) scale(.985); filter:blur(6px); pointer-events:none; transition:opacity var(--dur-l) var(--ease), transform var(--dur-l) var(--ease), filter var(--dur-l) var(--ease); }
.slide.active{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); pointer-events:auto; }
.slide.prev{ opacity:0; transform:translateY(-18px) scale(.99); filter:blur(4px); }
.kicker{ font-size:11.5px; font-weight:600; letter-spacing:.18em; color:var(--primary); text-transform:uppercase; margin-bottom:14px; opacity:0; filter:blur(4px); transform:translateY(8px); }
.slide.active .kicker{ animation:riseIn var(--dur) 60ms var(--ease) forwards; }
h1.stitle{ font-size:clamp(28px,3.6vw,50px); font-weight:600; line-height:1.08; letter-spacing:-.02em; max-width:960px; opacity:0; filter:blur(6px); transform:translateY(14px); }
.slide.active h1.stitle{ animation:riseIn var(--dur) 160ms var(--ease) forwards; }
.ssub{ font-size:clamp(13.5px,1.1vw,17px); color:var(--muted); font-weight:400; margin-top:10px; max-width:640px; opacity:0; filter:blur(4px); transform:translateY(10px); }
.slide.active .ssub{ animation:riseIn var(--dur) 260ms var(--ease) forwards; }
@keyframes riseIn{ to{ opacity:1; transform:translateY(0); filter:blur(0);} }
.stage{ flex:1; min-height:0; margin-top:3vh; display:flex; align-items:center; justify-content:center; overflow-y:auto; }
.glass{ background:rgba(255,255,255,.55); backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%); border:1px solid rgba(255,255,255,.5); border-radius:18px; box-shadow:0 24px 70px rgba(20,18,26,.08); }
html[data-theme="dark"] .glass{ background:rgba(255,255,255,.035); border-color:rgba(255,255,255,.08); box-shadow:0 24px 70px rgba(0,0,0,.4); }
.progress-track{ position:fixed; top:0; left:0; height:2px; width:100%; background:var(--line); z-index:60;}
.progress-fill{ height:100%; background:var(--primary); transition:width var(--dur) var(--ease); }
.counter{ position:fixed; bottom:24px; right:32px; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; z-index:60; letter-spacing:.03em;}
.counter b{ color:var(--ink); font-weight:600; }
.brandmark{ position:fixed; bottom:24px; left:32px; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.1em; z-index:60; }
.brandmark span{ color:var(--primary); }
.actmark{ position:fixed; top:20px; left:32px; font-size:10.5px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; z-index:60; }
.controls{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:60; }
.controls button{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all var(--dur-s) var(--ease); }
.controls button:hover{ background:var(--primary); color:#fff; border-color:var(--primary); transform:scale(1.06); }
.toprow{ position:fixed; top:16px; right:22px; display:flex; gap:8px; z-index:60; }
.iconbtn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--muted); cursor:pointer; font-size:12.5px; display:flex; align-items:center; justify-content:center; transition:all var(--dur-s) var(--ease); }
.iconbtn:hover{ color:var(--primary); border-color:var(--primary); }
.notes-panel{ position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:14px 7vw; font-size:13px; color:var(--muted); line-height:1.6; max-height:0; overflow:hidden; transition:max-height var(--dur) var(--ease); z-index:55; }
.notes-panel.open{ max-height:150px; }
.notes-panel b{ color:var(--primary); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:5px;}
.overview{ position:fixed; inset:0; background:var(--paper); z-index:70; display:none; padding:56px 6vw; overflow-y:auto; }
.overview.open{ display:block; }
.overview h2{ font-size:20px; margin-bottom:22px; }
.ovgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.ovcard{ border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; transition:all var(--dur-s) var(--ease); background:var(--panel); }
.ovcard:hover{ border-color:var(--primary); transform:translateY(-3px); }
.ovcard .n{ font-size:10.5px; color:var(--primary); font-weight:700; margin-bottom:5px; }
.ovcard .t{ font-size:13px; font-weight:600; line-height:1.3; }
.ovclose{ position:absolute; top:22px; right:32px; }
.tip{ position:fixed; z-index:200; pointer-events:none; max-width:230px; padding:11px 14px; border-radius:12px; background:var(--paper); border:1px solid var(--line); box-shadow:0 16px 40px rgba(20,18,26,.16); opacity:0; transform:translateY(6px) scale(.98); transition:opacity var(--dur-s) var(--ease), transform var(--dur-s) var(--ease); backdrop-filter:blur(14px); }
html[data-theme="dark"] .tip{ background:rgba(20,17,22,.94); }
.tip.show{ opacity:1; transform:translateY(0) scale(1); }
.tip .tt{ font-size:12.5px; font-weight:700; color:var(--primary); margin-bottom:3px; }
.tip .td{ font-size:11.5px; color:var(--muted); line-height:1.4; }

/* cards grid */
.card-grid{ display:grid; gap:12px; width:100%; }
.info-card{ padding:18px; cursor:pointer; transition:all var(--dur) var(--ease); opacity:0; transform:translateY(14px); }
.slide.active .info-card{ animation:riseIn var(--dur) var(--ease) forwards; }
.info-card .icn{ font-size:12px; margin-bottom:8px; }
.info-card .iname{ font-size:13.5px; font-weight:600; margin-bottom:5px; }
.info-card .idesc{ font-size:11px; color:var(--muted); max-height:0; opacity:0; overflow:hidden; transition:all var(--dur) var(--ease); line-height:1.5; }
.info-card.open .idesc{ max-height:110px; opacity:1; margin-top:5px; }
.info-card.open{ border-color:var(--primary); }

/* role hub */
.role-hub{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:1000px; }
.role-card{ width:150px; padding:22px 16px; text-align:center; cursor:pointer; transition:transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease); opacity:0; transform:translateY(18px); }
.slide.active .role-card{ animation:riseIn var(--dur) var(--ease) forwards; }
.role-card:hover{ transform:translateY(-6px); box-shadow:0 30px 80px rgba(112,32,112,.14); }
.role-card .ric{ width:46px; height:46px; border-radius:50%; background:var(--primary-light); border:1px solid var(--primary); margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--primary); transition:transform var(--dur) var(--ease); }
.role-card:hover .ric{ transform:scale(1.08); }
.role-card .rname{ font-size:14px; font-weight:600; margin-bottom:3px; }
.role-card .rtag{ font-size:10.5px; color:var(--muted); }
.journey-view{ display:none; width:100%; max-width:1080px; opacity:0; transform:translateY(14px); filter:blur(4px); }
.journey-view.open{ display:block; animation:riseIn var(--dur) var(--ease) forwards; }
.journey-back{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; margin-bottom:18px; transition:color var(--dur-s) var(--ease); }
.journey-back:hover{ color:var(--primary); }
.journey-steps{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
.jstep{ width:118px; padding:16px 10px; text-align:center; opacity:0; transform:translateY(14px); }
.journey-view.open .jstep{ animation:riseIn var(--dur) var(--ease) forwards; }
.jstep .num{ font-size:9.5px; color:var(--primary); font-weight:700; margin-bottom:6px; }
.jstep .lbl{ font-size:11.5px; font-weight:600; line-height:1.3; }
.journey-focus-wrap{ text-align:center; }
.journey-focus{ padding:14px 24px; border-radius:14px; display:inline-block; background:var(--primary-light); border:1px solid var(--primary); }
.journey-focus .fk{ font-size:10px; color:var(--primary); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:4px; }
.journey-focus .fv{ font-size:15.5px; font-weight:600; }

/* picker + stage player (scenarios / workflows) */
.picker-wrap{ width:100%; max-width:1100px; }
.picker-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:20px; }
.pchip{ font-size:11.5px; padding:8px 15px; border-radius:20px; border:1px solid var(--line); background:var(--paper); color:var(--muted); cursor:pointer; transition:all var(--dur-s) var(--ease); }
.pchip:hover{ border-color:var(--primary); color:var(--primary); }
.pchip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
.player-box{ text-align:center; }
.insight-line{ margin-top:16px; font-size:13.5px; color:var(--muted); font-style:italic; }
.insight-line b{ color:var(--primary); font-style:normal; }

/* architecture */
.arch-stack{ display:flex; flex-direction:column; gap:7px; width:100%; max-width:580px; }
.arch-layer{ padding:12px 18px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; transition:all var(--dur) var(--ease); opacity:0; transform:translateY(10px); }
.slide.active .arch-layer{ animation:riseIn var(--dur) var(--ease) forwards; }
.arch-layer .an{ font-size:13.5px; font-weight:600; }
.arch-layer .ad{ font-size:11px; color:var(--muted); max-width:300px; text-align:right; opacity:0; max-height:0; overflow:hidden; transition:opacity var(--dur) var(--ease); }
.arch-layer.on{ border-color:var(--primary); background:var(--primary-light); }
.arch-layer.on .ad{ opacity:1; }
.arch-connector{ width:1px; height:7px; background:var(--line); margin-left:18px; }

.replay-btn{ margin-top:18px; font-size:11px; padding:7px 15px; border-radius:20px; border:1px solid var(--line); background:var(--paper); color:var(--muted); cursor:pointer; transition:all var(--dur-s) var(--ease); }
.replay-btn:hover{ color:var(--primary); border-color:var(--primary); }
.banner{ padding:13px 24px; border-radius:14px; border:1px solid var(--gold); background:rgba(184,134,47,.08); color:var(--gold); font-size:13px; font-weight:600; text-align:center; margin-top:18px; }
.node-glow{ filter:drop-shadow(0 0 0px var(--primary)); transition:filter var(--dur) var(--ease), transform var(--dur) var(--ease); cursor:pointer; }
.node-glow:hover{ filter:drop-shadow(0 0 12px var(--primary)); transform:scale(1.06); }
.node-label-fo div{ font-family:var(--font); text-align:center; line-height:1.2; color:var(--muted); font-weight:500; }
.draw{ stroke-dasharray:900; stroke-dashoffset:900; }
.slide.active .draw{ animation:drawLine 1.6s .3s var(--ease) forwards; }
@keyframes drawLine{ to{ stroke-dashoffset:0; } }
.pulse-slow{ animation:pulseAnim 3.2s ease-in-out infinite; }
@keyframes pulseAnim{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
.chip{ fill:var(--primary-light); stroke:var(--primary); stroke-width:1.2; }
.chip-line{ stroke:var(--line); stroke-width:1.5; fill:none; transition:all var(--dur) var(--ease); }
.chip-line-active{ stroke:var(--primary); stroke-width:2.2; fill:none; transition:all var(--dur) var(--ease); }
.svgwrap{ width:100%; height:100%; max-height:54vh; }
.small-svgwrap{ max-height:44vh; }
footer.grad-closing{ position:absolute; inset:0; background:radial-gradient(circle at 30% 30%, var(--primary-light), transparent 60%); z-index:-1; opacity:.6; }
.two-col{ display:flex; gap:24px; width:100%; max-width:900px; }
.two-col .colcard{ flex:1; padding:22px; }
.two-col h4{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
.two-col .row{ display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
.two-col .row:last-child{ border-bottom:none; }
</style>
</head>
<body>
<div class="glow glow1"></div><div class="glow glow2"></div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="tip" id="tip"><div class="tt" id="tipTitle"></div><div class="td" id="tipDesc"></div></div>
<div class="deck" id="deck"></div>
<div class="notes-panel" id="notesPanel"><b>Speaker notes</b><span id="notesText"></span></div>
<div class="actmark" id="actMark">ACT I — VISION</div>
<div class="toprow">
  <button class="iconbtn" id="themeToggle" title="Toggle dark / light">&#9788;</button>
  <button class="iconbtn" id="notesToggle" title="Speaker notes (N)">&#128172;</button>
  <button class="iconbtn" id="gridToggle" title="Overview (G)">&#9638;</button>
  <button class="iconbtn" id="fsToggle" title="Presentation mode (F)">&#9974;</button>
</div>
<div class="controls"><button id="prevBtn">&#8592;</button><button id="nextBtn">&#8594;</button></div>
<div class="counter"><b id="curNum">01</b> / <span id="totalNum"></span></div>
<div class="brandmark">DENT<span>FLUENCE</span> EXPERIENCE CENTER</div>
<div class="overview" id="overview"><button class="iconbtn ovclose" id="ovClose">&#10005;</button><h2>All sections</h2><div class="ovgrid" id="ovgrid"></div></div>

<script>
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function svgBase(vb,small){ const s=document.createElementNS(NS,"svg"); s.setAttribute("viewBox",vb); s.setAttribute("class","svgwrap"+(small?" small-svgwrap":"")); return s; }
function h(tag,attrs,html){ const e=document.createElement(tag); if(attrs) for(const k in attrs){ if(k==='class') e.className=attrs[k]; else if(k==='style') e.style.cssText=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!==undefined) e.innerHTML=html; return e; }
const tipEl=document.getElementById('tip'), tipTitle=document.getElementById('tipTitle'), tipDesc=document.getElementById('tipDesc');
function showTip(evt,title,desc){ tipTitle.textContent=title; tipDesc.textContent=desc||''; tipEl.classList.add('show'); moveTip(evt); }
function moveTip(evt){ const x=evt.clientX,y=evt.clientY,vw=window.innerWidth; tipEl.style.left=(x+(vw-x<250?-240:16))+'px'; tipEl.style.top=(y+14)+'px'; }
function hideTip(){ tipEl.classList.remove('show'); }
function attachTip(node,title,desc){ node.classList.add('node-glow'); node.addEventListener('mouseenter',e=>showTip(e,title,desc)); node.addEventListener('mousemove',moveTip); node.addEventListener('mouseleave',hideTip); }
function foreignLabel(parent,x,y,w,hh,text,size){ const fo=el("foreignObject",{x:x-w/2,y:y,width:w,height:hh,class:"node-label-fo"},parent); const div=document.createElementNS("http://www.w3.org/1999/xhtml","div"); div.style.cssText=`font-size:${size||10}px;`; div.textContent=text; fo.appendChild(div); return fo; }

/* ============ reusable component: card grid ============ */
function buildCardGrid(items, cols){
  const grid=h('div',{class:'card-grid',style:`grid-template-columns:repeat(${cols},1fr);max-width:${cols*230}px;`});
  items.forEach((it,i)=>{
    const card=h('div',{class:'glass info-card',style:`animation-delay:${i*0.06}s`});
    if(it.icon) card.appendChild(h('div',{class:'icn'},it.icon));
    card.appendChild(h('div',{class:'iname'},it.name));
    card.appendChild(h('div',{class:'idesc'},it.desc));
    card.addEventListener('click',()=>card.classList.toggle('open'));
    grid.appendChild(card);
  });
  return grid;
}

/* ============ reusable component: stage player (scenarios / workflows / automation) ============ */
function buildStagePlayer(stages){
  const wrap=h('div',{class:'player-box'});
  const s=svgBase(`0 0 ${Math.max(stages.length*98,300)+30} 150`);
  const y=70;
  el("line",{x1:20,y1:y,x2:stages.length*98-30<40?40:stages.length*98-30,y2:y,class:"chip-line"},s);
  const fillLine=el("line",{x1:20,y1:y,x2:20,y2:y,class:"chip-line-active"},s);
  const nodes=[];
  stages.forEach((t,i)=>{
    const x=20+i*98;
    const n=el("g",{},s);
    const c=el("circle",{cx:x,cy:y,r:14,fill:"var(--paper)",stroke:"var(--line)","stroke-width":1.5},n);
    foreignLabel(s,x,y+24,90,34,t,8.8);
    nodes.push({c,x});
  });
  wrap.appendChild(s);
  function play(){
    nodes.forEach(n=>{ n.c.setAttribute('fill','var(--paper)'); n.c.setAttribute('stroke','var(--line)'); });
    fillLine.setAttribute('x2',20);
    nodes.forEach((n,i)=>{ setTimeout(()=>{ n.c.setAttribute('fill','var(--primary)'); n.c.setAttribute('stroke','var(--primary)'); fillLine.setAttribute('x2',n.x); }, 450+i*480); });
  }
  return {wrap, play};
}

/* ============ reusable component: picker + player ============ */
function buildScenarioTheatre(list, insightPrefix){
  const wrap=h('div',{class:'picker-wrap'});
  const row=h('div',{class:'picker-row'});
  const playerHost=h('div',{});
  const insight=h('div',{class:'insight-line'});
  wrap.appendChild(row); wrap.appendChild(playerHost); wrap.appendChild(insight);
  let current=null;
  function select(idx){
    row.querySelectorAll('.pchip').forEach((c,i)=>c.classList.toggle('active',i===idx));
    const item=list[idx];
    playerHost.innerHTML='';
    const {wrap:pw,play}=buildStagePlayer(item.beats);
    playerHost.appendChild(pw);
    insight.innerHTML = `<b>${insightPrefix}</b> ${item.insight}`;
    current={play};
    setTimeout(play, 350);
  }
  list.forEach((item,i)=>{
    const chip=h('div',{class:'pchip'}, item.name);
    chip.addEventListener('click',()=>select(i));
    row.appendChild(chip);
  });
  setTimeout(()=>select(0), 100);
  return wrap;
}

/* ============ reusable component: hub diagram ============ */
function buildHubDiagram(centerLabel, spokes){
  const s=svgBase("0 0 520 400");
  const cx=260,cy=195,R=160,Ry=135;
  spokes.forEach((sp,i)=>{
    const a=(i/spokes.length)*Math.PI*2 - Math.PI/2;
    const x=cx+R*Math.cos(a), y=cy+Ry*Math.sin(a);
    el("line",{x1:x,y1:y,x2:cx,y2:cy,class:"chip-line draw",style:`animation-delay:${i*.1}s`},s);
    const n=el("g",{class:"pulse-slow",style:`animation-delay:${i*.22}s`},s);
    el("circle",{cx:x,cy:y,r:23,class:"chip"},n);
    foreignLabel(s,x,y+29,98,28,sp.name,9.5);
    attachTip(n,sp.name,sp.desc);
  });
  el("circle",{cx,cy,r:40,fill:"var(--primary)"},s);
  foreignLabel(s,cx,cy-9,74,30,centerLabel,9.5);
  s.querySelector('.node-label-fo div').style.color="#fff"; s.querySelector('.node-label-fo div').style.fontWeight="700";
  return s;
}

/* ============ reusable component: dependency graph ============ */
function buildDependencyGraph(nodesList, deps){
  const s=svgBase("0 0 760 560");
  const cx=380,cy=280,R=225;
  const pos={},lineEls={},nodeEls={};
  nodesList.forEach((m,i)=>{ const a=(i/nodesList.length)*Math.PI*2 - Math.PI/2; pos[m]=[cx+R*Math.cos(a),cy+R*Math.sin(a)]; });
  const drawn=new Set();
  nodesList.forEach(m=>{ (deps[m]||[]).forEach(t=>{ const key=[m,t].sort().join('|'); if(drawn.has(key)||!pos[t]) return; drawn.add(key);
    const [x1,y1]=pos[m],[x2,y2]=pos[t]; lineEls[key]=el("line",{x1,y1,x2,y2,class:"chip-line",opacity:.25},s); }); });
  nodesList.forEach(m=>{
    const [x,y]=pos[m]; const n=el("g",{},s);
    el("circle",{cx:x,cy:y,r:24,class:"chip"},n);
    foreignLabel(s,x,y+31,98,28,m,9);
    nodeEls[m]=n;
    n.addEventListener('mouseenter',(e)=>{
      showTip(e,m,`Connected to ${(deps[m]||[]).length} other modules.`);

    el("circle",{cx:x,cy:y,r:20,class:"chip"},n);
    foreignLabel(s,x,y+26,90,28,t,9.5);
  });
  return s;
}

const ovgrid=document.getElementById('ovgrid');
SLIDES.forEach((sl,i)=>{
  const c=h('div',{class:'ovcard'});
  c.appendChild(h('div',{class:'n'}, String(i+1).padStart(2,'0')+' — '+sl.kicker));

let current=0; const total=SLIDES.length;
document.getElementById('totalNum').textContent=String(total).padStart(2,'0');
const slideEls=document.querySelectorAll('.slide');
function render(){
  slideEls.forEach((elx,i)=>{ elx.classList.remove('active','prev'); if(i===current) elx.classList.add('active'); else if(i<current) elx.classList.add('prev'); });
  document.getElementById('curNum').textContent=String(current+1).padStart(2,'0');
  document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';
  document.getElementById('notesText').textContent=SLIDES[current].notes;
  document.getElementById('actMark').textContent=SLIDES[current].act;
}
function goTo(i){ current=Math.max(0,Math.min(total-1,i)); render(); }
function next(){ goTo(current+1); } function prev(){ goTo(current-1); }
document.getElementById('nextBtn').onclick=next; document.getElementById('prevBtn').onclick=prev;
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ goTo(0); } else if(e.key==='End'){ goTo(total-1); }
  else if(e.key.toLowerCase()==='n'){ toggleNotes(); } else if(e.key.toLowerCase()==='g'){ toggleGrid(); }
  else if(e.key.toLowerCase()==='f'){ toggleFullscreen(); } else if(e.key==='Escape'){ toggleGrid(false); }
});
let touchX=null;
document.addEventListener('touchstart', e=> touchX=e.touches[0].clientX);
document.addEventListener('touchend', e=>{ if(touchX===null) return; const dx=e.changedTouches[0].clientX-touchX; if(dx<-50) next(); else if(dx>50) prev(); touchX=null; });
const themeToggle=document.getElementById('themeToggle');
themeToggle.onclick=()=>{ const html=document.documentElement; const cur=html.getAttribute('data-theme'); html.setAttribute('data-theme', cur==='light'?'dark':'light'); themeToggle.innerHTML = cur==='light' ? '&#9789;' : '&#9788;'; };
const notesPanel=document.getElementById('notesPanel');
function toggleNotes(force){ notesPanel.classList.toggle('open', force!==undefined?force:!notesPanel.classList.contains('open')); }
document.getElementById('notesToggle').onclick=()=>toggleNotes();
const overview=document.getElementById('overview');
function toggleGrid(force){ overview.classList.toggle('open', force!==undefined?force:!overview.classList.contains('open')); }
document.getElementById('gridToggle').onclick=()=>toggleGrid();
document.getElementById('ovClose').onclick=()=>toggleGrid(false);
function toggleFullscreen(){ if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); } else { document.exitFullscreen().catch(()=>{}); } }
document.getElementById('fsToggle').onclick=toggleFullscreen;
document.addEventListener('mousemove',(e)=>{
  const active=document.querySelector('.slide.active .stage'); if(!active) return;
  const r=active.getBoundingClientRect(); const relX=(e.clientX-(r.left+r.width/2))/r.width; const relY=(e.clientY-(r.top+r.height/2))/r.height;
  active.style.transform=`perspective(1000px) rotateY(${relX*2}deg) rotateX(${-relY*2}deg)`;
});
document.querySelectorAll('.stage').forEach(d=> d.style.transition='transform .5s cubic-bezier(.22,.61,.36,1)');
render();
