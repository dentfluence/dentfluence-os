<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dentfluence OS — A Briefing for Dr. Rajeev Chitguppi</title>
<style>
:root{
  --primary:#702070; --primary-dark:#4a1548; --primary-light:#f4e8f4;
  --ink:#14121a; --paper:#ffffff; --muted:#6b6470; --line:#e8e3e8;
  --panel:#faf7fa; --gold:#b8862f;
  --font: -apple-system, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
}
html[data-theme="dark"]{
  --ink:#f3eef3; --paper:#0f0d13; --muted:#a89fa8; --line:#2a2530; --panel:#171319; --primary-light:#2a1a2a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font); background:var(--paper); color:var(--ink);
  overflow:hidden; -webkit-font-smoothing:antialiased; transition:background .4s ease,color .4s ease;
}
.deck{position:relative; width:100vw; height:100vh; overflow:hidden;}
.slide{
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
  padding:6vh 9vw; opacity:0; transform:translateX(40px) scale(.98);
  pointer-events:none; transition:opacity .55s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1);
}
.slide.active{ opacity:1; transform:translateX(0) scale(1); pointer-events:auto; }
.slide.prev{ opacity:0; transform:translateX(-40px) scale(.98); }

.kicker{
  font-size:12.5px; font-weight:600; letter-spacing:.16em; color:var(--primary);
  text-transform:uppercase; margin-bottom:18px; opacity:0; transform:translateY(10px);
}
.slide.active .kicker{ animation:riseIn .5s .05s cubic-bezier(.22,.61,.36,1) forwards; }
h1.stitle{
  font-size:clamp(34px,4.6vw,64px); font-weight:600; line-height:1.08; letter-spacing:-.02em;
  max-width:920px; opacity:0; transform:translateY(16px);
}
.slide.active h1.stitle{ animation:riseIn .6s .12s cubic-bezier(.22,.61,.36,1) forwards; }
.ssub{
  font-size:clamp(15px,1.35vw,20px); color:var(--muted); font-weight:400; margin-top:14px; max-width:640px;
  opacity:0; transform:translateY(14px);
}
.slide.active .ssub{ animation:riseIn .6s .2s cubic-bezier(.22,.61,.36,1) forwards; }
@keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

.content-area{ display:flex; gap:6vw; align-items:center; margin-top:5vh; flex:1; min-height:0; }
.col-text{ flex:0 0 auto; max-width:420px; }
.col-diagram{ flex:1; min-width:0; height:100%; display:flex; align-items:center; justify-content:center; }

.bullets{ list-style:none; margin-top:6px; }
.bullets li{
  font-size:16px; color:var(--ink); padding:9px 0; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; opacity:0; transform:translateX(-10px);
}
.slide.active .bullets li{ animation:bulletIn .45s cubic-bezier(.22,.61,.36,1) forwards; }
.bullets li::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--primary); flex-shrink:0; }
.bullets li:last-child{ border-bottom:none; }

svg text{ font-family:var(--font); fill:var(--ink); }
.dim{ fill:var(--muted); }
.node-label{ font-size:12.5px; font-weight:500; }
.stage-label{ font-size:11.5px; }

/* chrome */
.chrome{ position:fixed; inset:0; pointer-events:none; z-index:50; }
.progress-track{ position:fixed; top:0; left:0; height:3px; width:100%; background:var(--line); z-index:60;}
.progress-fill{ height:100%; background:var(--primary); transition:width .5s cubic-bezier(.22,.61,.36,1); }
.counter{ position:fixed; bottom:26px; right:34px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; z-index:60; letter-spacing:.03em;}
.counter b{ color:var(--ink); font-weight:600; }
.brandmark{ position:fixed; bottom:26px; left:34px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.08em; z-index:60; }
.brandmark span{ color:var(--primary); }
.controls{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:60; }
.controls button{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--paper); color:var(--ink);
  cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.controls button:hover{ background:var(--primary); color:#fff; border-color:var(--primary); }
.toprow{ position:fixed; top:16px; right:22px; display:flex; gap:8px; z-index:60; }
.iconbtn{
  width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--muted);
  cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.iconbtn:hover{ color:var(--primary); border-color:var(--primary); }

.notes-panel{
  position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line);
  padding:16px 9vw; font-size:14px; color:var(--muted); line-height:1.6; max-height:0; overflow:hidden;
  transition:max-height .35s ease, padding .35s ease; z-index:55;
}
.notes-panel.open{ max-height:160px; padding:16px 9vw; }
.notes-panel b{ color:var(--primary); font-size:11px; letter-spacing:.1em; text-transform:uppercase; display:block; margin-bottom:6px;}

.overview{
  position:fixed; inset:0; background:var(--paper); z-index:70; display:none;
  padding:60px 6vw; overflow-y:auto;
}
.overview.open{ display:block; }
.overview h2{ font-size:22px; margin-bottom:26px; }
.ovgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
.ovcard{
  border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; transition:all .2s; background:var(--panel);
}
.ovcard:hover{ border-color:var(--primary); transform:translateY(-2px); }
.ovcard .n{ font-size:11px; color:var(--primary); font-weight:700; margin-bottom:6px; }
.ovcard .t{ font-size:14px; font-weight:600; line-height:1.3; }
.ovclose{ position:absolute; top:24px; right:34px; }

/* diagram shared elements */
.svgwrap{ width:100%; height:100%; max-height:56vh; }
.chip{ fill:var(--primary-light); stroke:var(--primary); stroke-width:1.2; }
.chip-line{ stroke:var(--line); stroke-width:1.5; fill:none; }
.chip-line-active{ stroke:var(--primary); stroke-width:2; fill:none; }
.pulse{ animation:pulseAnim 2.2s ease-in-out infinite; }
@keyframes pulseAnim{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
.draw{ stroke-dasharray:600; stroke-dashoffset:600; }
.slide.active .draw{ animation:drawLine 1.4s .3s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes drawLine{ to{ stroke-dashoffset:0; } }
.hexseg{ cursor:pointer; transition:transform .25s ease, opacity .25s ease; transform-origin:center; }
.hexseg:hover{ transform:scale(1.04); }
.hexseg-list{ font-size:10.5px; fill:var(--muted); opacity:0; transition:opacity .2s; }
.hexseg.open .hexseg-list{ opacity:1; }

footer.grad-closing{
  position:absolute; inset:0; background:radial-gradient(circle at 30% 30%, var(--primary-light), transparent 60%);
  z-index:-1; opacity:.6;
}

/* ---- futuristic upgrade layer ---- */
.orb{ position:fixed; border-radius:50%; filter:blur(70px); pointer-events:none; z-index:0; opacity:.35; }
.orb1{ width:420px; height:420px; background:var(--primary); top:-10%; right:-8%; animation:driftA 22s ease-in-out infinite; }
.orb2{ width:340px; height:340px; background:var(--gold); bottom:-12%; left:-6%; animation:driftB 26s ease-in-out infinite; opacity:.18; }
@keyframes driftA{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-40px,30px) scale(1.08);} }
@keyframes driftB{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(30px,-25px) scale(1.12);} }
.deck, .toprow, .controls, .counter, .brandmark, .notes-panel, .overview{ position:relative; z-index:1; }

.node-glow{ filter:drop-shadow(0 0 0px var(--primary)); transition:filter .3s ease, transform .3s cubic-bezier(.22,.61,.36,1); cursor:pointer; }
.node-glow:hover{ filter:drop-shadow(0 0 10px var(--primary)); transform:scale(1.08); }

.tip{
  position:fixed; z-index:200; pointer-events:none; max-width:220px; padding:10px 13px; border-radius:10px;
  background:var(--paper); border:1px solid var(--line); box-shadow:0 12px 32px rgba(20,18,26,.16);
  opacity:0; transform:translateY(4px); transition:opacity .15s ease, transform .15s ease;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
html[data-theme="dark"] .tip{ background:rgba(23,19,25,.92); }
.tip.show{ opacity:1; transform:translateY(0); }
.tip .tt{ font-size:12.5px; font-weight:700; color:var(--primary); margin-bottom:3px; }
.tip .td{ font-size:11.5px; color:var(--muted); line-height:1.4; }

.node-label-fo div{ font-family:var(--font); text-align:center; line-height:1.2; color:var(--muted); font-weight:500; }

@keyframes riseIn{ to{ opacity:1; transform:translateY(0); filter:blur(0); } }
.kicker, h1.stitle, .ssub{ filter:blur(4px); }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<div class="tip" id="tip"><div class="tt" id="tipTitle"></div><div class="td" id="tipDesc"></div></div>

<div class="deck" id="deck"></div>

<div class="notes-panel" id="notesPanel"><b>Speaker notes</b><span id="notesText"></span></div>

<div class="toprow">
  <button class="iconbtn" id="themeToggle" title="Toggle dark / light">&#9788;</button>

  <button class="iconbtn" id="fsToggle" title="Presentation mode (F)">&#9974;</button>
</div>

  <button id="prevBtn" title="Previous (&larr;)">&#8592;</button>

  <button class="iconbtn ovclose" id="ovClose">&#10005;</button>
  <h2>All slides</h2>
  <div class="ovgrid" id="ovgrid"></div>
</div>

<script>
const SLIDES = [
{kicker:"DENTFLUENCE OS",title:"Dentfluence OS",sub:"The Operating System for Modern Dentistry",content:["A private briefing for Dr. Rajeev Chitguppi"],diagram:"hero",notes:"Thank you for your time, Dr. Chitguppi. What you're about to see isn't a pitch — it's the architecture of a system built inside a working clinic, over years, to solve real problems we lived through."},
{kicker:"FOUNDER",title:"Dr. Sumit Firke",sub:"Dentist. Founder. Builder.",content:["Practicing dentist","Founder of Dentfluence","Built from real clinical pain","Built inside a working dental clinic — Tulip Dental","Every workflow tested on real patients before it shipped"],diagram:"profile",notes:"I didn't start as a software founder. I started as a dentist who got tired of eleven different tools that refused to talk to each other."},
{kicker:"THE PROBLEM",title:"Dentistry runs on fragments",sub:"Nothing is connected",content:["Excel sheets","Paper registers","WhatsApp for follow-up","A CRM, bolted on","Separate billing software","A separate PMS"],diagram:"scatter",notes:"This isn't hypothetical. This is Monday morning in most clinics — including ours, before we built this."},
{kicker:"THE STATUS QUO",title:"What a PMS does — and doesn't",sub:"Practice management software was never built to run the practice",content:[],diagram:"compare",notes:"Most PMS platforms are genuinely excellent at scheduling and records. They were simply never built to run the practice as a business."},
{kicker:"DEFINITION",title:"What is Dentfluence OS",sub:"An operating system — not a point tool",content:["Not a PMS","Not a CRM","Not an EMR","Not an AI chatbot"],diagram:"stack",notes:"Think of it the way an operating system relates to the apps on your phone. Everything else can plug into this layer."},
{kicker:"PHILOSOPHY",title:"Dentfluence Philosophy",sub:"Six principles, no exceptions",content:[],diagram:"grid",notes:"Every product decision gets run through these filters before it ships. If a feature fails one of them, it doesn't ship."},
{kicker:"ARCHITECTURE",title:"High-Level Architecture",sub:"Six layers. One system. Hover to explore.",content:[],diagram:"hex",notes:"This is the same map my engineering team uses internally to track production readiness, module by module."},
{kicker:"WORKFLOW",title:"Clinical Workflow",sub:"One patient. One continuous record.",content:[],diagram:"chain",diagramData:["Registration","Appointment","Consultation","Tx Plan","Tx Visit","Prescription","Billing","Membership","Wallet","PRE","Recall"],notes:"Every one of these steps writes to the same patient record. Nothing gets re-typed, nothing gets lost between systems."},
{kicker:"MODULES",title:"Dentfluence Modules",sub:"Sixteen modules. One shared core. Hover a module.",content:[],diagram:"orbit",notes:"I won't walk through all sixteen individually — but notice: every one connects back to a single patient identity."},
{kicker:"PATIENT JOURNEY",title:"The Patient Journey",sub:"What the patient actually experiences",content:[],diagram:"path",diagramData:["Walks in","Registered once","Seen","Treated","Billed","Reminded","Returns"],notes:"None of the complexity you've seen so far should ever be visible to the patient. That's the actual measure of whether this works."},
{kicker:"TEAM JOURNEY",title:"Dentist & Team Journey",sub:"One OS. Every role.",content:[],diagram:"fan",diagramData:["Reception","Assistant","Doctor","Manager","Owner"],notes:"Reception doesn't see what the owner sees. But they're both looking at the same underlying truth, in real time."},
{kicker:"BUSINESS JOURNEY",title:"The Business Journey",sub:"From lead to loyalty",content:[],diagram:"funnel",diagramData:["Lead","Consultation","Acceptance","Treatment","Billing","Follow-up","Recall","Loyal Patient"],notes:"This is the loop most clinics quietly lose money in — the gap between 'consultation' and 'recall'. The system exists to close it."},
{kicker:"RELATIONSHIP ENGINE",title:"No Separate CRM Required",sub:"The CRM is already inside",content:["Patient Relationship Engine (PRE)","Opportunity Engine","Recall Engine","Communication Engine"],diagram:"hub",notes:"We built this because bolting a CRM onto a PMS never actually works in practice — the data always lags behind reality."},
{kicker:"ACCOUNTABILITY",title:"Staff Accountability",sub:"Every action has an owner",content:[],diagram:"stamp",diagramData:["Owner","Timestamp","Status","Audit Trail"],notes:"In a clinic, ambiguity is exactly where trust breaks down between doctor and staff. We designed that ambiguity out."},
{kicker:"COMPLIANCE",title:"Compliance Ready",sub:"Built for what's coming, not just what's required",content:[],diagram:"shield",diagramData:["ABHA","DPDP","Consent","Patient Rights","Audit Logs","Data Retention"],notes:"India's DPDP Act has a hard compliance deadline. We're building to it now, deliberately, rather than retrofitting later."},
{kicker:"GROWTH, DIFFERENTLY",title:"Ethical Growth Engine",sub:"Growth without manipulation",content:["No manipulation","No fear marketing","Patient education","Clinical transparency","Trust-driven growth"],diagram:"duallines",notes:"We deliberately did not build fear-based recall messaging. It works short-term and quietly destroys trust long-term."},
{kicker:"AI STRATEGY",title:"AI Strategy",sub:"AI assists. The doctor decides.",content:[],diagram:"radial",diagramData:["Documentation","Clinical Assistance","Automation","Analytics","Communication"],notes:"Every AI feature we ship has one hard rule: it can suggest, it can draft, it can flag. It cannot decide."},
{kicker:"FUTURE ROADMAP — NOT V1",title:"Tulip — the AI Secretary",sub:"Where the architecture is designed to go",content:[],diagram:"constellation",diagramData:["Voice Commands","Agentic AI","Smart Scheduling","Autonomous Follow-ups","AI Reception","AI Assistant","AI Practice Manager","AI Analytics"],notes:"I want to be direct: none of this exists yet. This is where the architecture is designed to go — not what I'm asking you to evaluate today."},
{kicker:"ENGINEERING DISCIPLINE",title:"Engineering Discipline",sub:"Eleven gates. Every module. No exceptions.",content:[],diagram:"gates",diagramData:["Audit","Planning","Implementation","Testing","Bug Fixes","Parity","Variants","Hardening","Live Validation","Freeze","Production Ready"],notes:"This is the literal checklist every module must pass before we call it production-ready. Nothing skips a gate."},
{kicker:"DEFENSIBILITY",title:"Why This Is Difficult To Copy",sub:"The moat isn't the code",content:[],diagram:"iceberg",notes:"Code can be copied in a weekend. Three years of clinical workflow refinement inside a real, operating practice cannot."},
{kicker:"OPPORTUNITY",title:"Business Opportunity",sub:"A large, fragmented, underserved market",content:[],diagram:"wheel",diagramData:["Subscription","Clinical Media","Education","Marketplace","Enterprise"],notes:"I'd rather show you the shape of the opportunity than throw a market-size number at you that neither of us can verify in this room."},
{kicker:"EXECUTION STRATEGY",title:"Execution Strategy",sub:"Prove it in one clinic. Then scale it.",content:[],diagram:"stairs",diagramData:["Tulip Dental","Production Ready","10 Clinics","100 Clinics","1,000 Clinics","Scale"],notes:"We are deliberately not skipping steps. Every clinic after Tulip Dental has to be earned on product quality, not sales pressure."},
{kicker:"CAPITAL STRATEGY",title:"Why We Are Not Raising Investment Today",sub:"Product first. Validation first. Scale later.",content:[],diagram:"words",diagramData:["Product First","Validation First","Scale Later"],notes:"We didn't want this conversation to be about money. We wanted it to be about the product, and about your judgment of it."},
{kicker:"THE ASK",title:"Where We Need Help",sub:"This is not a pitch. It's an invitation.",content:[],diagram:"ring",diagramData:["Strategic Advisor","Industry Feedback","Clinical Critique","Innovation Guidance","Conference Exposure","Educational Collaboration","Product Validation"],notes:"What we're asking for today is your perspective — not your money, not an endorsement. Your critique, honestly, is worth more to us right now."},
{kicker:"CLOSING",title:"Dentfluence is not another dental software.",sub:"It is building the Operating System on which the future dental practice will run.",content:[],diagram:"hero2",notes:"Thank you, Dr. Chitguppi. I'd welcome your questions — and your skepticism."}
];

const NS = "http://www.w3.org/2000/svg";
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function svgBase(vb){ const s=document.createElementNS(NS,"svg"); s.setAttribute("viewBox",vb); s.setAttribute("class","svgwrap"); return s; }

// ---------- descriptions for hover tooltips ----------

 "Patients":"Single patient identity — every module reads and writes here.",
 "Appts":"Scheduling, reminders, and slot management.","Appointments":"Scheduling, reminders, and slot management.",

 "ABHA":"India's national health ID integration.",

// ---------- tooltip ----------
const tipEl = document.getElementById('tip');
const tipTitle = document.getElementById('tipTitle');
const tipDesc = document.getElementById('tipDesc');
function showTip(evt, title, desc){
  tipTitle.textContent = title;
  tipDesc.textContent = desc || '';
  tipEl.classList.add('show');
  moveTip(evt);
}
function moveTip(evt){
  const x = evt.clientX, y = evt.clientY;
  const vw = window.innerWidth;
  tipEl.style.left = (x + (vw - x < 240 ? -230 : 16)) + 'px';
  tipEl.style.top = (y + 14) + 'px';
}
function hideTip(){ tipEl.classList.remove('show'); }
function attachTip(node, label, descOverride){
  node.classList.add('node-glow');
  node.addEventListener('mouseenter', (e)=> showTip(e, label, descOverride || DESC[label] || ''));
  node.addEventListener('mousemove', moveTip);
  node.addEventListener('mouseleave', hideTip);
}
function foreignLabel(parent, x, y, w, h, text, size){
  const fo = el("foreignObject",{x:x-w/2, y:y, width:w, height:h, class:"node-label-fo"}, parent);
  const div = document.createElementNS("http://www.w3.org/1999/xhtml","div");
  div.style.cssText = `font-size:${size||10}px;`;
  div.textContent = text;
  fo.appendChild(div);
  return fo;
}

function diagramHero(){
  const d=document.createElement('div');
  d.style.cssText="text-align:center;width:100%;position:relative;";
  d.innerHTML = `<footer class="grad-closing"></footer>`;
  return d;
}
function diagramProfile(){
  const s=svgBase("0 0 400 260");
  const g=el("g",{},s);
  el("circle",{cx:80,cy:110,r:56,class:"chip"},g);
  el("text",{x:80,y:118,"text-anchor":"middle",class:"node-label",style:"font-size:26px;font-weight:600"},g).textContent="SF";
  el("line",{x1:150,y1:110,x2:340,y2:110,class:"chip-line draw"},g);
  ["Clinic","Code"].forEach((t,i)=>{
    const cx=150+i*190;
    el("circle",{cx:cx,cy:110,r:6,fill:"var(--primary)"},g);
    el("text",{x:cx,y:145,"text-anchor":"middle",class:"node-label dim"},g).textContent=t;
  });
  return s;
}
function diagramScatter(){
  const s=svgBase("0 0 440 320");
  const items=["Excel","Paper","WhatsApp","CRM","Billing","PMS"];
  const pos=[[70,70],[340,60],[60,230],[380,210],[210,50],[220,270]];
  const g=el("g",{},s);
  pos.forEach((p,i)=>{
    const nxt=pos[(i+1)%pos.length];
    el("line",{x1:p[0],y1:p[1],x2:nxt[0],y2:nxt[1],class:"chip-line",style:"stroke-dasharray:4,6",opacity:.4},g);
  });
  pos.forEach((p,i)=>{
    const c=el("g",{class:"pulse",style:`animation-delay:${i*0.2}s`},g);
    el("circle",{cx:p[0],cy:p[1],r:22,class:"chip"},c);
    foreignLabel(g,p[0],p[1]+30,90,30,items[i],11);
    attachTip(c, items[i], "Disconnected from every other system.");
  });
  return s;
}
function diagramCompare(){
  const wrap=document.createElement('div');

// ---------- build slides ----------
const deck = document.getElementById('deck');
SLIDES.forEach((sl,i)=>{
  const section = document.createElement('section');
  section.className = 'slide';
  section.dataset.index = i;

  const kicker = document.createElement('div'); kicker.className='kicker'; kicker.textContent = sl.kicker;
  const title = document.createElement('h1'); title.className='stitle'; title.textContent = sl.title;
  const sub = document.createElement('div'); sub.className='ssub'; sub.textContent = sl.sub;

  section.appendChild(kicker); section.appendChild(title); section.appendChild(sub);

  const contentArea = document.createElement('div'); contentArea.className='content-area';
  let hasText = sl.content && sl.content.length>0;
  if(hasText){
    const colText = document.createElement('div'); colText.className='col-text';
    const ul = document.createElement('ul'); ul.className='bullets';
    sl.content.forEach((c,ci)=>{ const li=document.createElement('li'); li.style.animationDelay=(0.1+ci*0.08)+'s'; li.textContent=c; ul.appendChild(li); });
    colText.appendChild(ul);
    contentArea.appendChild(colText);
  }
  const colDiagram = document.createElement('div'); colDiagram.className='col-diagram';
  if(sl.diagram !== 'hero' && sl.diagram !== 'hero2'){
    const node = RENDERERS[sl.diagram] ? RENDERERS[sl.diagram](sl.diagramData) : document.createElement('div');
    colDiagram.appendChild(node);
  }
  contentArea.appendChild(colDiagram);

  if(sl.diagram==='hero' || sl.diagram==='hero2'){
    section.appendChild(RENDERERS[sl.diagram]());
  } else {
    section.appendChild(contentArea);
  }

  deck.appendChild(section);
});

  slideEls.forEach((el,i)=>{
    el.classList.remove('active','prev');
    if(i===current) el.classList.add('active');
    else if(i<current) el.classList.add('prev');
  });
  document.getElementById('curNum').textContent = String(current+1).padStart(2,'0');
  document.getElementById('progressFill').style.width = ((current+1)/total*100)+'%';
  document.getElementById('notesText').textContent = SLIDES[current].notes;
}
function goTo(i){ current = Math.max(0, Math.min(total-1, i)); render(); }
function next(){ goTo(current+1); }
function prev(){ goTo(current-1); }

document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ goTo(0); }
  else if(e.key==='End'){ goTo(total-1); }
  else if(e.key.toLowerCase()==='n'){ toggleNotes(); }
  else if(e.key.toLowerCase()==='g'){ toggleGrid(); }
  else if(e.key.toLowerCase()==='f'){ toggleFullscreen(); }
  else if(e.key==='Escape'){ toggleGrid(false); }
});

let touchX=null;
document.addEventListener('touchstart', e=> touchX = e.touches[0].clientX);
document.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx < -50) next(); else if(dx > 50) prev();
  touchX=null;
});

// theme
const themeToggle = document.getElementById('themeToggle');
themeToggle.onclick = ()=>{
  const html = document.documentElement;
  const cur = html.getAttribute('data-theme');
  html.setAttribute('data-theme', cur==='light' ? 'dark':'light');
  themeToggle.innerHTML = cur==='light' ? '&#9789;' : '&#9788;';
};

// notes
const notesPanel = document.getElementById('notesPanel');
function toggleNotes(force){ notesPanel.classList.toggle('open', force!==undefined?force:!notesPanel.classList.contains('open')); }
document.getElementById('notesToggle').onclick = ()=> toggleNotes();

// overview
const overview = document.getElementById('overview');
function toggleGrid(force){ overview.classList.toggle('open', force!==undefined?force:!overview.classList.contains('open')); }
document.getElementById('gridToggle').onclick = ()=> toggleGrid();
document.getElementById('ovClose').onclick = ()=> toggleGrid(false);

// fullscreen
function toggleFullscreen(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else{ document.exitFullscreen().catch(()=>{}); }
}
document.getElementById('fsToggle').onclick = toggleFullscreen;

render();

// ---------- subtle parallax on diagrams (premium feel) ----------
document.addEventListener('mousemove', (e)=>{
  const active = document.querySelector('.slide.active .col-diagram');
  if(!active) return;
  const r = active.getBoundingClientRect();
  const relX = (e.clientX - (r.left + r.width/2)) / r.width;
  const relY = (e.clientY - (r.top + r.height/2)) / r.height;
  active.style.transform = `perspective(900px) rotateY(${relX*4}deg) rotateX(${-relY*4}deg)`;
});
document.querySelectorAll('.col-diagram').forEach(d=> d.style.transition='transform .25s ease-out');
</script>
</body>
</html>
