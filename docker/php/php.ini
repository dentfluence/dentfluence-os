; =============================================================================
; Dentfluence — Production PHP settings (loaded into PHP-FPM)
; Tuned for a clinic app that uploads patient images / scanned forms.
; =============================================================================

; --- Resource limits ---------------------------------------------------------
memory_limit = 512M
; 1 hour. A 200 MB upload over clinic wifi at ~2 Mbps up takes about 13 minutes
; of wall clock, and the old 120s killed it long before the file arrived — with
; a 504 that said nothing about size. Uploads stream to disk, so a long request
; here costs a worker slot, not memory.
max_execution_time = 3600
max_input_time = 3600
max_input_vars = 5000

; --- File uploads ------------------------------------------------------------
; 12 Sep 2026: the caps came off after real CBCT report PDFs over 200 MB were
; refused. PHP has no "unlimited" for upload_max_filesize — it takes a size —
; so 1 GB is the number, matched in ClinicalFileUploadService.
;
; post_max_size = 0 means the POST body itself is unchecked, so the per-FILE
; limit above is the only one that applies. Set together with nginx's
; client_max_body_size; either one alone still refuses the upload, and nginx
; refuses it with a 413 before PHP is ever reached.
upload_max_filesize = 1024M
post_max_size = 0

; --- Error handling: never show errors to the browser in production ----------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Security: hide PHP version, restrict risky behaviour --------------------
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; --- Sessions / timezone -----------------------------------------------------
date.timezone = "Asia/Kolkata"

; --- OPcache: compiles PHP to bytecode and keeps it in memory (big speedup) ---
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
; In production the code does not change at runtime, so don't re-check files
; on every request (faster). A new deploy = new container = fresh cache.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
